[project]
name = "esign-agent"
version = "0.1.0"
description = "Seat 18 (E-sign) agent and harness for AgentSwitch"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Mutation anchors must match the source text byte for byte, so they cannot wrap.
"scripts/mutate.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
